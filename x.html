<!doctype html>
<html lang="ru">
<body>

<div id="playerFrame" style="width: 100%; height: 100%;"></div>

<script>
(function() {
  const params = new URLSearchParams(location.search);
  const id = params.get('id');
  
  if (id) {
    const iframe = document.createElement('iframe');
    iframe.src = `${id}`;
    document.getElementById('playerFrame').appendChild(iframe);
  }
})();
</script>

</body>
</html>
